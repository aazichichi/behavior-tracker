info:
  name: Session Chart
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseURL}}/api/sessions/{{sessionId}}/chart"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 with intervals and totals", function () {
          expect(res.getStatus()).to.equal(200);
          expect(body.intervals).to.be.an("array");
          expect(body.totals).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The end-of-session interval chart: which behavior codes happened in each interval, plus totals.
