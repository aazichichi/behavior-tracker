info:
  name: List Students
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseURL}}/api/students"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 with an array", function () {
          expect(res.getStatus()).to.equal(200);
          expect(body).to.be.an("array");
        });

        test("includes the student just created", function () {
          expect(body.map((s) => s._id)).to.include(bru.getVar("studentId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  All of your students, sorted by last name. Add ?search=ava to filter by name.
