info:
  name: Delete Student
  type: http
  seq: 19

http:
  method: DELETE
  url: "{{baseURL}}/api/students/{{studentId}}"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 and reports what was removed", function () {
          expect(res.getStatus()).to.equal(200);
          expect(body.deleted).to.have.property("sessions");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Removes the test student and all its behaviors, sessions and events, so the demo data stays clean.
