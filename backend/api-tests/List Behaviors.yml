info:
  name: List Behaviors
  type: http
  seq: 12

http:
  method: GET
  url: "{{baseURL}}/api/students/{{studentId}}/behaviors"
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 200 with the behavior", function () {
          expect(res.getStatus()).to.equal(200);
          expect(body.length).to.be.at.least(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Active behaviors for the student. Add ?includeArchived=true to see archived ones too.
