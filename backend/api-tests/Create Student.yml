info:
  name: Create Student
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseURL}}/api/students"
  body:
    type: json
    data: |-
      {
        "firstName": "Ava",
        "lastName": "Brooks",
        "gradeLevel": "2",
        "notes": "Created from Bruno"
      }
  auth:
    type: bearer
    token: "{{token}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.getStatus() === 201) {
          bru.setVar("studentId", res.getBody()._id);
        }
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("belongs to the logged-in user", function () {
          expect(body.UserId).to.equal(bru.getVar("userId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Adds a student to your caseload and saves {{studentId}} for the requests that follow.
