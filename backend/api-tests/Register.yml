info:
  name: Register
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseURL}}/api/users"
  body:
    type: json
    data: |-
      {
        "firstName": "Test",
        "lastName": "Teacher",
        "email": "{{newLogin}}@example.com",
        "login": "{{newLogin}}",
        "password": "{{newPassword}}",
        "role": "teacher"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Registering the same login twice returns 409, so make each run unique
        bru.setVar("newLogin", `teacher${Date.now()}`);
        bru.setVar("newPassword", "Passw0rd!");
    - type: tests
      code: |-
        const body = res.getBody();

        test("responds 201 Created", function () {
          expect(res.getStatus()).to.equal(201);
        });

        test("returns a confirmation message", function () {
          expect(body.message).to.equal("User registered successfully");
        });

        test("returns a token and the new user", function () {
          expect(body.token).to.be.a("string");
          expect(body.user.Login).to.equal(bru.getVar("newLogin"));
          expect(body.user.IsVerified).to.equal(false);
        });

        test("never returns the password or tokens", function () {
          expect(body.user).to.not.have.property("Password");
          expect(body.user).to.not.have.property("VerificationToken");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Creates a new teacher account. Does not change the logged-in user for the requests that follow.
